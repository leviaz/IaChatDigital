<header class="site-header">
  <div class="id-container header-inner">
    <a class="brand" routerLink="/inicio" aria-label="Idoso Digital IA — início">
      <img
        class="brand-logo"
        src="logo-idoso-digital.png"
        width="72"
        height="72"
        alt=""
      />
      <span class="brand-text">
        <span class="brand-title">Idoso Digital IA</span>
        <span class="tagline">Ajuda simples e segura para usar o celular e a internet</span>
      </span>
    </a>

    <nav class="nav" aria-label="Principal">
      @if (autenticado) {
        <span class="user">Olá, {{ nome }}</span>
        <a class="id-btn id-btn--secondary" routerLink="/inicio" routerLinkActive="active">Início</a>
        <a class="id-btn id-btn--secondary" routerLink="/biblioteca" routerLinkActive="active">Biblioteca</a>
        <a class="id-btn id-btn--secondary" routerLink="/praticar" routerLinkActive="active">Praticar</a>
        <a class="id-btn" routerLink="/chat" routerLinkActive="active">Perguntar</a>
        <button class="id-btn id-btn--secondary" type="button" (click)="sair()">Sair</button>
      } @else {
        <a class="id-btn id-btn--secondary" routerLink="/login" routerLinkActive="active">Entrar</a>
        <a class="id-btn" routerLink="/cadastro" routerLinkActive="active">Criar conta</a>
      }
    </nav>
  </div>
</header>

<main class="site-main">
  <router-outlet />
</main>
